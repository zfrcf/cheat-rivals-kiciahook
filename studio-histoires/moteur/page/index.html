<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Studio Histoires — moteur</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="out"></canvas>
<script src="commun.js"></script>
<script src="plat2d.js"></script>
<script type="module">
import './cube3d.js';
window.MOTEUR_PRET = true;
</script>
<script>
// API pilotée par rendu.js (Playwright) ou par l'aperçu navigateur
window.initialiser = async (TL) => {
  while (!window.MOTEUR_PRET) await new Promise(r => setTimeout(r, 20));
  await S.chargerPolices(); S.preparer(TL);
  const out = document.getElementById('out'); out.width = TL.W; out.height = TL.H;
  window.TL = TL; window.MOTEUR = TL.projet.style === 'cube3d' ? Cube3D : Plat2D;
  MOTEUR.init(TL, out); return true;
};
window.images = (debut, n, fps, qualite) => {
  const out = document.getElementById('out'), res = [];
  for (let i = 0; i < n; i++) { MOTEUR.frame((debut + i) / fps); res.push(out.toDataURL('image/jpeg', qualite || 0.92).slice(23)); }
  return res;
};
// Miniature : image clé + gros titre (sans sous-titres)
window.miniature = (t, titre) => {
  const out = document.getElementById('out'), ctx = out.getContext('2d'), W = out.width, H = out.height, U = Math.min(W, H);
  const st = TL.projet.sous_titres; TL.projet.sous_titres = 'aucun'; MOTEUR.frame(t); TL.projet.sous_titres = st;
  const g = ctx.createLinearGradient(0, H * 0.45, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,8,30,0.75)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const mots = String(titre).toUpperCase().split(' '); const max = W > H ? 18 : 12; let lignes = [mots.join(' ')];
  if (lignes[0].length > max) { let best = null; for (let i = 1; i < mots.length; i++) { const a = mots.slice(0, i).join(' '), b = mots.slice(i).join(' '); const c = Math.max(a.length, b.length); if (!best || c < best[0]) best = [c, a, b]; } lignes = [best[1], best[2]]; }
  const taille = U * (W > H ? 0.13 : 0.11);
  lignes.forEach((l, i) => { ctx.save(); ctx.translate(W / 2, H * (W > H ? 0.78 : 0.75) + (i - (lignes.length - 1) / 2) * taille * 1.05); ctx.rotate(-0.03); S.texte(ctx, l, 0, 0, taille, i % 2 ? '#fff' : S.JAUNE, { epaisseur: 0.2 }); ctx.restore(); });
  return out.toDataURL('image/jpeg', 0.92).slice(23);
};
// Aperçu interactif : index.html?timeline=chemin/timeline.json
(async () => {
  const q = new URLSearchParams(location.search).get('timeline'); if (!q) return;
  const TL = await (await fetch(q)).json(); await initialiser(TL);
  const out = document.getElementById('out'); out.style.width = '100vw'; out.style.height = '100vh'; out.style.objectFit = 'contain';
  const a = new Audio(q.replace('timeline.json', 'mix.wav')); const t0 = performance.now();
  a.play().catch(() => {});
  const boucle = () => { const t = a.currentTime || (performance.now() - t0) / 1000; MOTEUR.frame(t % TL.duree); requestAnimationFrame(boucle); }; boucle();
})();
</script></body></html>
