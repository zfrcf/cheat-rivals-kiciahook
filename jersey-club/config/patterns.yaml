# Patterns sur une grille de 48 ticks par mesure (12 par temps).
# 3 ticks = double-croche, 4 = triolet de croches, 2 = triolet de doubles.
# Les patterns extraits des références sont ajoutés automatiquement (source + score).
kick:
  bounce_classique: {ticks: [0, 12, 24, 32, 40], source: hypothese, score: 1.0}   # noires sur 1-2, triolet de noires sur 3-4
  bounce_rafale:    {ticks: [0, 12, 24, 36, 40, 44], source: hypothese, score: 1.0}  # noires puis triolet de croches sur le 4
  bounce_syncope:   {ticks: [0, 12, 24, 30, 36], source: hypothese, score: 1.0}    # croche syncopée sur le 3-et
clap:
  backbeat:   {ticks: [12, 36], source: hypothese, score: 1.0}
  four_floor: {ticks: [0, 12, 24, 36], source: hypothese, score: 1.0}
hats:
  doubles:      {ticks: [0, 3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36, 39, 42, 45], source: hypothese, score: 1.0}
  triolets_dbl: {ticks: "every 2", source: hypothese, score: 1.0}
rolls:            # avant les drops, densité croissante (pas en ticks)
  kick_roll: {bars: 1, subdivisions: [4, 3, 2]}
  clap_roll: {bars: 1, subdivisions: [6, 4, 3]}
