name: AppImage Droid (APK)
on:
  push:
    paths: ["appimage-droid/**", ".github/workflows/appimage-droid.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: appimage-droid } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: sudo apt-get install -y squashfs-tools
      - run: ./gradlew testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AppImageDroid-apk
          path: appimage-droid/app/build/outputs/apk/release/app-release.apk
