name: CI PhonePilot
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bridge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: bridge/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
  cloud-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd bridge && npm ci
      - run: cd cloud && npm ci && npx tsc -p . && npm run e2e
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: PhonePilot-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
